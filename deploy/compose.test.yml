# Throwaway project for the real-Postgres tests. scripts/update.sh starts it, waits for the tests
# container to exit, then removes it and its data. Its only network is internal to this project,
# so nothing in it can reach the live stack or the internet.
name: family-time-test

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: family_time
      POSTGRES_DB: family_time
      POSTGRES_PASSWORD: throwaway
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_time -d family_time"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test]

  # A fresh AdGuard Home v0.107.79, still in its first-install wizard, for the contract tests. Always
  # this throwaway one, whichever AdGuard the live stack uses (ADR 0022): scripts/test-pg.mjs refuses
  # any other address. No route out and no published port: the tests only talk to its API.
  adguard:
    image: adguard/adguardhome:v0.107.79
    tmpfs:
      - /opt/adguardhome/work
      - /opt/adguardhome/conf
    networks: [test]

  # A throwaway single-validator Besu, the same start script as the live one, with one-second
  # blocks so the ledger's real-chain tests are quick. Its key is made fresh in its temporary
  # folder. No route out and no published port.
  besu:
    image: hyperledger/besu:26.10.2
    entrypoint: ["/bin/bash", "/besu-setup/start.sh"]
    environment:
      BLOCK_SECONDS: "1"
      BESU_DATA: /opt/besu/data
      JAVA_OPTS: -Xmx1g
    volumes:
      - ./besu:/besu-setup:ro
      - type: tmpfs
        target: /opt/besu/data
        tmpfs:
          mode: 01777
    networks: [test]

  tests:
    image: family-time:test-${IMAGE_TAG:?IMAGE_TAG is set by scripts/update.sh}
    command: ["node", "scripts/test-pg.mjs"]
    environment:
      DATABASE_URL: postgres://family_time:throwaway@postgres:5432/family_time
      ADGUARD_URL: http://adguard:3000
      ADGUARD_USER: familytime
      ADGUARD_PASSWORD: contract-test-password
      ADGUARD_CONTRACT_TARGET: throwaway
      BESU_RPC_URL: http://besu:8545
    depends_on:
      postgres:
        condition: service_healthy
      adguard:
        condition: service_started
      besu:
        condition: service_started
    networks: [test]

networks:
  test:
    internal: true
