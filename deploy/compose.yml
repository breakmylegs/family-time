# The production stack. Run it through scripts/update.sh, which sets IMAGE_TAG, or through the
# systemd unit, which reads the tag update.sh last deployed from deploy/.state/image.env.
# Memory limits are sized so the whole stack, with AdGuard and Besu added later, fits a Pi 5 with 8 GB.
name: family-time

x-app: &app
  image: family-time:${IMAGE_TAG:?IMAGE_TAG is set by scripts/update.sh}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
    - /run/app-secrets:mode=0700
  # Root only in the entrypoint, to copy secrets and drop to `node`.
  cap_drop: [ALL]
  cap_add: [CHOWN, FOWNER, SETUID, SETGID]
  security_opt: ["no-new-privileges:true"]
  environment:
    PGHOST: postgres
    PGUSER: family_time
    PGDATABASE: family_time
    PGPASSWORD_FILE: /run/app-secrets/postgres_password
    ADGUARD_URL: http://adguard:3000
    ADGUARD_USER: familytime
    ADGUARD_PASSWORD_FILE: /run/app-secrets/adguard_password
    VAPID_PRIVATE_KEY_FILE: /run/app-secrets/vapid_private.pem
    LOG_LEVEL: info
    TZ: Europe/London
  secrets: [postgres_password, adguard_password, vapid_private.pem]
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_time
      POSTGRES_DB: family_time
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      # Postgres 18 keeps its data in a versioned folder under this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_time -d family_time"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    mem_limit: 512m
    shm_size: 128m
    logging: *logging

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    mem_limit: 256m

  api:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      internal: {}
      proxy:
        aliases: [family-time-api]
    mem_limit: 384m

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # egress: out to the browsers' push services (Apple, Google, Mozilla, Microsoft) for alerts.
    # Nothing is published, so nothing can reach the worker from outside.
    networks: [internal, egress]
    mem_limit: 256m

  # Home DNS. Port 53 is published on the server's LAN address only (LAN_IP, from
  # deploy/.state/network.env, written by init.sh), never on every address. The admin API on 3000
  # is never published: only the api and worker reach it, over the internal network. Nothing uses
  # this DNS until a device or the router is pointed at it (docs/setup/network.md).
  adguard:
    image: adguard/adguardhome:v0.107.79
    restart: unless-stopped
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    ports:
      - "${LAN_IP:?LAN_IP comes from deploy/.state/network.env, written by init.sh}:53:53/udp"
      - "${LAN_IP}:53:53/tcp"
    networks:
      internal:
        aliases: [adguard]
      egress: {}
    mem_limit: 256m
    logging: *logging

  # Added in later phases: besu under profile ledger-besu (Phase 5), ollama under profile ai-local (Phase 7).

networks:
  # No route out. Postgres is reachable only from inside the stack.
  internal:
    internal: true
  # The way out: AdGuard to upstream DNS (and where its port 53 is published), the worker to the
  # push services. Outbound only; the worker publishes no port.
  egress: {}
  # Caddy's network. Only the api joins it.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy_net}

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  adguard_password:
    file: ../secrets/adguard_password
  vapid_private.pem:
    file: ../secrets/vapid_private.pem

volumes:
  pgdata:
  adguard-work:
  adguard-conf:
