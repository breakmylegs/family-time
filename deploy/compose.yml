# The production stack. Run it through scripts/update.sh, which sets IMAGE_TAG, or through the
# systemd unit, which reads the tag update.sh last deployed from deploy/.state/image.env.
# Memory limits are sized so the whole stack, with AdGuard and Besu added later, fits a Pi 5 with 8 GB.
name: family-time

x-app: &app
  image: family-time:${IMAGE_TAG:?IMAGE_TAG is set by scripts/update.sh}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
    - /run/app-secrets:mode=0700
  # Root only in the entrypoint, to copy secrets and drop to `node`.
  cap_drop: [ALL]
  cap_add: [CHOWN, FOWNER, SETUID, SETGID]
  security_opt: ["no-new-privileges:true"]
  environment:
    PGHOST: postgres
    PGUSER: family_time
    PGDATABASE: family_time
    PGPASSWORD_FILE: /run/app-secrets/postgres_password
    ADGUARD_URL: http://adguard:3000
    ADGUARD_USER: familytime
    ADGUARD_PASSWORD_FILE: /run/app-secrets/adguard_password
    VAPID_PRIVATE_KEY_FILE: /run/app-secrets/vapid_private.pem
    VAPID_PUBLIC_KEY_FILE: /run/app-secrets/vapid_public.txt
    # The ledger: postgres (the default), or besu with the ledger-besu profile (docs/setup/besu.md).
    LEDGER_ADAPTER: ${LEDGER_ADAPTER:-postgres}
    LEDGER_SIGNER_KEY_FILE: /run/app-secrets/ledger_signer_key
    BESU_RPC_URL: http://besu:8545
    # The kiosk's address on the LAN, shown with a pairing code in Settings (ADR 0015).
    KIOSK_LAN_URL: http://${LAN_IP}:${KIOSK_HOST_PORT:-8180}
    # Seals AI keys and signs MCP confirmations (ADR 0016). Only the api has the file; without it AI stays off.
    MASTER_KEY_FILE: /run/app-secrets/master_key
    # Owner sign-in through Authentik (docs/setup/authentik.md). Empty, the init.sh default, is off.
    OIDC_CLIENT_SECRET_FILE: /run/app-secrets/oidc_client_secret
    LOG_LEVEL: info
    TZ: Europe/London
  # Each service lists only the secrets it needs; this default is the migrate service's.
  secrets: [postgres_password]
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_time
      POSTGRES_DB: family_time
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      # Postgres 18 keeps its data in a versioned folder under this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_time -d family_time"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    mem_limit: 512m
    shm_size: 128m
    logging: *logging

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    mem_limit: 256m

  api:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # Only the public half of the alerts key: the worker alone sends alerts (ADR 0017).
    secrets: [postgres_password, adguard_password, vapid_public.txt, master_key, oidc_client_secret]
    # The kiosk (ADR 0015): its own listener in the api, published on the server's LAN address
    # only, never through Caddy. Firewall it to the tablet on the router (docs/setup/kiosk.md).
    ports:
      - "${LAN_IP}:${KIOSK_HOST_PORT:-8180}:3001"
    # egress: out to the AI providers, an app's client metadata document, the weather service, the
    # owner's Ollama (ADR 0016) and Authentik for owner sign-in (ADR 0019). The api only calls out
    # once the owner switches one of them on.
    # Nothing is published on it.
    # ai: the stack's own Ollama, when the ai-local profile is on.
    networks:
      internal: {}
      egress: {}
      ai: {}
      proxy:
        aliases: [family-time-api]
    mem_limit: 384m

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # egress: out to the browsers' push services (Apple, Google, Mozilla, Microsoft) for alerts.
    # ledger: the Besu node, which only the worker reaches. Nothing is published, so nothing can
    # reach the worker from outside. The worker alone holds the ledger signer key; the ledger-*
    # commands run in this service for that reason (scripts/ft.sh).
    networks: [internal, egress, ledger]
    secrets: [postgres_password, adguard_password, vapid_private.pem, ledger_signer_key]
    mem_limit: 256m

  # Home DNS. Port 53 is published on the server's LAN address only (LAN_IP, from
  # deploy/.state/network.env, written by init.sh), never on every address. The admin API on 3000
  # is never published: only the api and worker reach it, over the internal network. Nothing uses
  # this DNS until a device or the router is pointed at it (docs/setup/network.md).
  adguard:
    image: adguard/adguardhome:v0.107.79
    restart: unless-stopped
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    ports:
      - "${LAN_IP:?LAN_IP comes from deploy/.state/network.env, written by init.sh}:53:53/udp"
      - "${LAN_IP}:53:53/tcp"
    networks:
      internal:
        aliases: [adguard]
      egress: {}
    mem_limit: 256m
    logging: *logging

  # The Besu ledger (ADR 0014), only with the ledger-besu profile: a single QBFT validator, free
  # gas, five-second blocks. Its RPC answers on the internal network only and nothing is
  # published, so nothing outside the stack can reach it. The validator key is a Docker secret
  # init.sh made; the chain lives in its own volume, which backups snapshot (Phase 8).
  # Works out the ledger signer's address, once, with no network, so the node can refuse every
  # other account (ADR 0014). Only the address reaches the node, through the besu-permissions volume.
  besu-allowlist:
    profiles: [ledger-besu]
    image: hyperledger/besu:26.10.2
    restart: "no"
    user: "0:0"
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/bash", "/besu-setup/allowlist.sh"]
    environment:
      LEDGER_SIGNER_KEY_FILE: /run/secrets/ledger_signer_key
      JAVA_OPTS: -Xmx256m
    secrets: [ledger_signer_key]
    volumes:
      - ./besu:/besu-setup:ro
      - besu-permissions:/permissions
    mem_limit: 512m
    logging: *logging

  besu:
    profiles: [ledger-besu]
    image: hyperledger/besu:26.10.2
    restart: unless-stopped
    depends_on:
      besu-allowlist:
        condition: service_completed_successfully
    # Starts as root only to read its key secret (mounted root-only, mode 0600); start.sh then copies
    # the key to /run/besu and runs Besu as the image's besu user (ADR 0017). The capabilities are
    # the ones that hand-over needs, and no more.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    tmpfs:
      - /run/besu:mode=0700
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/bash", "/besu-setup/start.sh"]
    environment:
      BLOCK_SECONDS: "5"
      BESU_DATA: /opt/besu/data
      BESU_NODE_KEY_FILE: /run/secrets/besu_node_key
      JAVA_OPTS: -Xmx2g
    secrets: [besu_node_key]
    volumes:
      - ./besu:/besu-setup:ro
      - besu-data:/opt/besu/data
      - besu-permissions:/permissions:ro
    # Its own network, shared only with the worker: the api, AdGuard and Postgres cannot reach it.
    networks:
      ledger:
        aliases: [besu]
    mem_limit: 3g
    pids_limit: 512
    logging: *logging

  # Local AI (brief Part 16), only with the ai-local profile: Ollama, which the api reaches as
  # http://ollama:11434. Its own network, shared only with the api, with no route out: nothing else
  # in the stack can reach it, and it cannot reach the internet, so nothing leaves the house.
  # Off by default; an Ollama elsewhere on the home network works too (docs/setup/ai-and-mcp.md).
  ollama:
    profiles: [ai-local]
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # One model in memory at a time, unloaded after five idle minutes, so the Pi keeps its RAM.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama-models:/root/.ollama
    networks:
      ai:
        aliases: [ollama]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 4g
    logging: *logging

  # Downloads a model into the same volume, then stops (./scripts/ft.sh ollama-pull). The only Ollama
  # with a way out, and only while it runs. Never started by itself: its profile is never switched on.
  ollama-pull:
    profiles: [ai-local-pull]
    image: ollama/ollama:0.40.15
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "ollama serve >/dev/null 2>&1 & sleep 3; ollama pull \"$$MODEL\""]
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama-models:/root/.ollama
    networks: [egress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    logging: *logging

networks:
  # No route out. Postgres is reachable only from inside the stack.
  internal:
    internal: true
  # The way out: AdGuard to upstream DNS (and where its port 53 is published), the worker to the
  # push services, the api to AI providers. Outbound only; neither publishes a port on it.
  egress: {}
  # The Besu node and the worker, and nothing else. No route out.
  ledger:
    internal: true
  # Local AI: Ollama and the api, and nothing else. No route out.
  ai:
    internal: true
  # Caddy's network. Only the api joins it.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy_net}

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  adguard_password:
    file: ../secrets/adguard_password
  vapid_private.pem:
    file: ../secrets/vapid_private.pem
  vapid_public.txt:
    file: ../secrets/vapid_public.txt
  ledger_signer_key:
    file: ../secrets/ledger_signer_key
  besu_node_key:
    file: ../secrets/besu_node_key
  master_key:
    file: ../secrets/master_key
  oidc_client_secret:
    file: ../secrets/oidc_client_secret

volumes:
  pgdata:
  adguard-work:
  adguard-conf:
  besu-data:
  besu-permissions:
  ollama-models:
