# The ledger contract (ADR 0014). Built and tested in the image's contracts stage with the Foundry
# release pinned in the Dockerfile; never on the laptop.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["node_modules", "lib"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.38"
# Cancun, because OpenZeppelin 5.6 uses mcopy. The Besu genesis switches Cancun on at block 0.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
